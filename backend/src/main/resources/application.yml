server:
  # 기본은 이 머신에서만 접근 가능하게 둔다. 같은 네트워크의 다른 기기에서 보려면
  # SERVER_ADDRESS=0.0.0.0 으로 명시적으로 풀고, 신뢰하는 망에서만 쓴다.
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8080

spring:
  application:
    name: carrepo

  datasource:
    url: jdbc:postgresql://localhost:5432/carrepo
    username: carrepo
    password: carrepo

  jpa:
    # 스키마의 정본은 Flyway 다. JPA 는 매핑이 어긋나면 기동을 막는 역할만 한다.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.carrepo: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [carrepo] %logger{0} - %msg%n"

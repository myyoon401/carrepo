services:
  postgres:
    image: postgres:17-alpine
    container_name: carrepo-postgres
    environment:
      POSTGRES_DB: carrepo
      POSTGRES_USER: carrepo
      POSTGRES_PASSWORD: carrepo
    ports:
      # LAN 에 노출하지 않는다. 공개 저장소에 비밀번호가 적혀 있으므로 특히 중요하다.
      - "127.0.0.1:5432:5432"
    volumes:
      - carrepo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carrepo -d carrepo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  carrepo-pgdata:
